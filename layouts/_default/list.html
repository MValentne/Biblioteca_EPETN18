{{ define "main" }}
<main class="max-w-7xl mx-auto px-4 py-8">
  <!-- Cabecera de la Biblioteca -->
  <div class="mb-8 pb-4 border-b border-gray-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight flex items-center gap-2">
        <span>Catálogo por Categorías</span>
      </h1>
      <p class="text-gray-500 text-sm mt-1">
        Explora las colecciones y libros de la Biblioteca EPET N° 18 organizados por género temático.
      </p>
    </div>

    <!-- Buscador / Filtro Rápido -->
    <div class="flex items-center gap-2">
      <div class="relative">
        <input id="search-input" type="text" placeholder="Buscar por título, autor, ISBN o categoría..." 
               class="pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-64 md:w-80 shadow-sm" />
        <svg class="w-4 h-4 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <button id="clear-search" class="hidden text-xs text-gray-500 hover:text-gray-800 underline font-medium">Limpiar</button>
    </div>
  </div>

  <!-- Contenedor Principal de Bloques por Categoría -->
  <div id="categories-container" class="space-y-10">
    <!-- Renderizado dinámico instantáneo -->
  </div>

  <!-- Modal Interactivo de Detalle del Libro -->
  <div id="book-modal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 md:p-8 shadow-2xl relative animate-in fade-in zoom-in duration-200 max-h-[90vh] overflow-y-auto">
      <button onclick="closeBookModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-full p-2 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <div class="flex flex-col sm:flex-row gap-6">
        <div class="flex-shrink-0 flex justify-center">
          <img id="modal-cover" class="w-40 h-60 object-cover rounded-lg shadow-md border" src="" alt="Portada">
        </div>
        <div class="flex-1 flex flex-col justify-between">
          <div>
            <span id="modal-category" class="inline-block bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded-full font-semibold uppercase tracking-wide mb-2"></span>
            <h2 id="modal-title" class="text-2xl font-bold text-gray-900 leading-tight"></h2>
            <p id="modal-authors" class="text-sm font-semibold text-blue-700 mt-1"></p>

            <div class="mt-3 flex flex-wrap gap-2 text-xs text-gray-500 bg-gray-50 p-2.5 rounded-lg border border-gray-100">
              <span id="modal-publisher"></span>
              <span id="modal-date"></span>
              <span id="modal-pages"></span>
              <span id="modal-isbn"></span>
            </div>

            <div class="mt-4">
              <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Sinopsis</h4>
              <p id="modal-desc" class="text-sm text-gray-600 mt-1 max-h-48 overflow-y-auto leading-relaxed"></p>
            </div>
          </div>

          <div class="mt-6 pt-4 border-t border-gray-100 flex items-center justify-between">
            <a id="modal-link" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg shadow-sm transition">
              <span>Consultar en Google Books</span>
              <svg class="w-4 h-4 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>
            <button onclick="closeBookModal()" class="text-xs text-gray-500 hover:text-gray-800 font-medium">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
window.LIBRARY_BOOKS = {{ .Site.Params.libros | jsonify }};
let globalBooks = window.LIBRARY_BOOKS || [];

function openBookModal(isbn) {
  const book = globalBooks.find(b => b.isbn === isbn);
  if (!book) return;

  document.getElementById('modal-title').textContent = book.title || 'Sin título';
  const authorsText = Array.isArray(book.authors) ? book.authors.join(', ') : (book.authors || 'Autor desconocido');
  document.getElementById('modal-authors').textContent = `Autor(es): ${authorsText}`;
  
  const coverEl = document.getElementById('modal-cover');
  if (book.cover) {
    coverEl.src = book.cover;
    coverEl.classList.remove('hidden');
  } else {
    coverEl.classList.add('hidden');
  }

  document.getElementById('modal-category').textContent = book.category || 'General';
  document.getElementById('modal-publisher').textContent = book.publisher ? `Editorial: ${book.publisher} •` : '';
  document.getElementById('modal-date').textContent = book.year ? `Año: ${book.year} •` : '';
  document.getElementById('modal-pages').textContent = book.pages ? `${book.pages} págs. •` : '';
  document.getElementById('modal-isbn').textContent = `ISBN: ${book.isbn}`;
  document.getElementById('modal-desc').textContent = book.description || 'Sin sinopsis disponible.';
  
  const linkEl = document.getElementById('modal-link');
  linkEl.href = `https://books.google.com/books?vid=ISBN${encodeURIComponent(book.isbn)}`;

  document.getElementById('book-modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeBookModal() {
  document.getElementById('book-modal').classList.add('hidden');
  document.body.style.overflow = 'auto';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeBookModal();
});

function renderCategories(books) {
  const container = document.getElementById('categories-container');
  if (!container) return;

  if (books.length === 0) {
    container.innerHTML = `
      <div class="text-center py-16 bg-gray-50 rounded-2xl border border-gray-100">
        <span class="text-4xl">🔍</span>
        <p class="text-gray-700 font-semibold mt-3">No se encontraron libros.</p>
        <p class="text-xs text-gray-400 mt-1">Intenta con otro término de búsqueda.</p>
      </div>
    `;
    return;
  }

  // Agrupar libros por categoría
  const groups = {};
  books.forEach(book => {
    const cat = book.category || 'General';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(book);
  });

  const sortedCategories = Object.keys(groups).sort();

  let html = '';
  sortedCategories.forEach(catName => {
    const list = groups[catName];
    html += `
      <section class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm hover:shadow-md transition-shadow">
        <div class="flex items-center justify-between pb-4 mb-6 border-b border-gray-100">
          <div class="flex items-center space-x-3">
            <span class="p-2 bg-blue-50 text-blue-600 rounded-lg text-lg">📂</span>
            <div>
              <h2 class="text-xl font-bold text-gray-900 leading-none">${catName}</h2>
              <span class="text-xs text-gray-400 font-medium">${list.length} ${list.length === 1 ? 'libro' : 'libros'}</span>
            </div>
          </div>
          <span class="text-xs font-semibold px-3 py-1 bg-gray-100 text-gray-600 rounded-full">
            Categoría
          </span>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
          ${list.map(book => {
            const authorsText = Array.isArray(book.authors) ? book.authors[0] : (book.authors || 'Autor desconocido');
            return `
              <div class="group cursor-pointer bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1.5 flex flex-col justify-between border border-gray-100"
                   onclick="openBookModal('${book.isbn}')">
                <div class="w-full aspect-[2/3] bg-gray-100 overflow-hidden relative flex items-center justify-center">
                  <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" onerror="this.src='https://covers.openlibrary.org/b/isbn/${book.isbn}-M.jpg'">
                  <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                    <span class="bg-white/90 text-gray-900 text-[11px] font-bold px-2.5 py-1 rounded-full shadow">Ver Detalle 🔍</span>
                  </div>
                </div>
                <div class="p-2.5">
                  <h3 class="font-bold text-gray-900 text-xs line-clamp-2 leading-tight group-hover:text-blue-600 transition" title="${book.title}">${book.title}</h3>
                  <p class="text-[11px] text-gray-500 font-medium line-clamp-1 mt-1">${authorsText}</p>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </section>
    `;
  });

  container.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', function() {
  renderCategories(globalBooks);

  const searchInput = document.getElementById('search-input');
  const clearBtn = document.getElementById('clear-search');

  searchInput.addEventListener('input', function(e) {
    const q = e.target.value.toLowerCase().trim();
    if (q) clearBtn.classList.remove('hidden');
    else clearBtn.classList.add('hidden');

    if (!q) {
      renderCategories(globalBooks);
      return;
    }

    const filtered = globalBooks.filter(b => {
      const title = (b.title || '').toLowerCase();
      const authors = Array.isArray(b.authors) ? b.authors.join(' ').toLowerCase() : (b.authors || '').toLowerCase();
      const isbn = (b.isbn || '').toLowerCase();
      const cat = (b.category || '').toLowerCase();
      return title.includes(q) || authors.includes(q) || isbn.includes(q) || cat.includes(q);
    });

    renderCategories(filtered);
  });

  clearBtn.addEventListener('click', function() {
    searchInput.value = '';
    clearBtn.classList.add('hidden');
    renderCategories(globalBooks);
  });
});
</script>
{{ end }}
