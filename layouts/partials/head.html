<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="{{ "images/logo-epet18.png" | relURL }}">
  <link rel="shortcut icon" href="{{ "favicon.ico" | relURL }}">
  <link rel="apple-touch-icon" href="{{ "images/logo-epet18.png" | relURL }}">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="preload stylesheet" type="text/css" href="{{ "lightgallery-bundle.min.css" | relURL }}">
  <script src="{{ "tailwind.js" | relURL }}"></script>

  <style>
    body {
